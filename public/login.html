<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - PeeCee</title><style>body{font-family:Arial,sans-serif;background:#111;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.container{background:#1b1b1b;padding:30px;border-radius:12px;width:350px}.tabs{display:flex;gap:10px;margin-bottom:20px}.tabs button{flex:1;padding:10px}.form{display:flex;flex-direction:column;gap:10px}input{padding:10px}.hidden{display:none}button{padding:10px;cursor:pointer}.msg{margin-top:10px;color:#00d4ff}a{color:#00d4ff}</style></head><body><div class="container"><h2>PeeCee</h2><div class="tabs"><button onclick="showLogin()">Login</button><button onclick="showCadastro()">Cadastro</button></div><div id="login" class="form"><input placeholder="E-mail"><input type="password" placeholder="Senha"><button onclick="acao('Login realizado com sucesso!')">Entrar</button></div><div id="cadastro" class="form hidden"><input placeholder="Nome"><input placeholder="E-mail"><input type="password" placeholder="Senha"><button onclick="acao('Cadastro realizado com sucesso!')">Cadastrar</button></div><p id="msg" class="msg"></p><p><a href="home.html">← Voltar para Home</a></p></div><script>function showLogin(){login.classList.remove('hidden');cadastro.classList.add('hidden')}function showCadastro(){cadastro.classList.remove('hidden');login.classList.add('hidden')}function acao(t){document.getElementById('msg').textContent=t}</script></body></html>
