<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeeCee</title>
    
    <link rel="stylesheet" href="assets/css/gabinete.css">
    <link rel="stylesheet" href="assets/css/menuUser.css">

    <!-- imports de fontes que eu achei mt *SABORRRRRRRR* brabas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="overlay" id="overlay"></div>
    <div class="overlay overlay-user" id="overlayUser"></div>

    <header>
        <button class="menu-toggle" id="openMenu" aria-label="Abrir menu principal">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <div class="logo">
            <h1><a href="https://youtu.be/0uz_v_mdQv0" target="_blank">Pee<span>Cee</span></a></h1>
        </div>
        
        <button id="abrirMenu" class="user-menu-btn" aria-label="Abrir menu do usuário" style="background: none; border: none; cursor: pointer;">
            <img src="avatar.svg" alt="Perfil do usuário">
        </button> 
    </header>

    <aside class="sidebar" id="sidebar">
        <button class="close-menu" id="closeMenu" aria-label="Fechar menu">✖</button>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Peças</a></li>
                <li><a href="https://youtu.be/OjNpRbNdR7E" target="_blank">Builds</a></li>
                <li><a href="https://youtu.be/fER8zIAhRD0" target="_blank">Guias</a></li>
            </ul>
        </nav>
    </aside>

    <nav class="menu user-menu" id="menu" aria-label="Menu da conta">
        <button class="close-menu close-user-menu" id="closeUserMenu" aria-label="Fechar menu da conta">✖</button>
        <ul>
            <li><a href="login.html">Login</a></li>
            <li><a href="login.html">Cadastrar</a></li>
        </ul>
    </nav>

    <main>
        <section class="hero">
            <h2>Monte o seu <span>Setup dos Sonhos</span></h2>
            <p>Encontre as melhores peças, monte sua build e eleve seu computador ao nível máximo.</p>
            
            <form class="search-box" action="#" method="GET">
                <input type="text" id="searchInput" name="query" placeholder="Buscar placa de vídeo, processador..." required>
                <button type="submit" aria-label="Buscar"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
            </form>
        </section>

        <section class="categories">
            <div class="category-card">
                <i class="fa-solid fa-microchip" aria-hidden="true"></i>
                <h3>Processadores</h3>
            </div>
            <div class="category-card">
                <i class="fa-solid fa-vr-cardboard" aria-hidden="true"></i>
                <h3>Placas de Vídeo</h3>
            </div>
            <div class="category-card">
                <i class="fa-solid fa-memory" aria-hidden="true"></i>
                <h3>Memória RAM</h3>
            </div>
            <div class="category-card">
                <i class="fa-solid fa-fan" aria-hidden="true"></i>
                <h3>Refrigeração</h3>
            </div>
        </section>
    </main>

    <script src="assets/js/script.js"></script>
    <script src="assets/js/menuUser.js"></script>
</body>
</html>
